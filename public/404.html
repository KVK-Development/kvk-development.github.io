<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>Red Mesa Development</title>
    <!--
      GitHub Pages SPA redirect. Pages has no server-side routing, so a direct
      hit or refresh on a path like /infrastructure would 404. This rewrites the
      path into a query string and bounces to index.html, where a matching
      snippet restores the real URL before React Router boots.
      Custom domain serves at the root, so pathSegmentsToKeep = 0.
      See https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
